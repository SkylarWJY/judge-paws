document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

bblegum:#FF4D97; --pink:#FF87BE; --pink-soft:#FFD3E6;\n    --lavender:#B49BFF; --lavender-soft:#E6DCFF; --peach:#FFB088; --peach-soft:#FFE0CC;\n    --mint:#34D3A6; --red:#FF5470; --gold:#FFC24B;\n    --ink:#5A2D49; --ink-soft:#9A7690; --ink-faint:#C4A8BC;\n    --cream:#FFF6FB; --white:#fff;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html { scroll-behavior: smooth; }\n  body {\n    font-family: 'Nunito', sans-serif; color: var(--ink);\n    background: var(--cream); overflow-x: hidden;\n    -webkit-font-smoothing: antialiased;\n  }\n  h1,h2,h3,h4 { font-family: 'Fredoka', sans-serif; font-weight: 600; line-height: 1.04; letter-spacing: -0.5px; }\n  a { color: inherit; text-decoration: none; }\n  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }\n  .center { text-align: center; }\n\n  /* ── buttons ── */\n  .btn {\n    display: inline-flex; align-items: center; gap: 9px; cursor: pointer;\n    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px;\n    padding: 15px 28px; border-radius: 999px; border: none;\n    transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;\n    white-space: nowrap;\n  }\n  .btn-primary {\n    color: #fff; background: linear-gradient(180deg, var(--pink), var(--bubblegum));\n    box-shadow: 0 12px 26px rgba(255,77,151,.4), inset 0 1px 1px rgba(255,255,255,.6);\n  }\n  .btn-primary:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 18px 34px rgba(255,77,151,.5); }\n  .btn-ghost {\n    color: var(--bubblegum); background: rgba(255,255,255,.75);\n    border: 1.5px solid var(--pink-soft); box-shadow: 0 6px 16px rgba(214,98,168,.1);\n  }\n  .btn-ghost:hover { transform: translateY(-2px); background: #fff; }\n\n  /* ── glass ── */\n  .glass {\n    background: rgba(255,255,255,.62);\n    backdrop-filter: blur(22px) saturate(160%);\n    -webkit-backdrop-filter: blur(22px) saturate(160%);\n    border: 1px solid rgba(255,255,255,.85);\n    box-shadow: 0 14px 40px rgba(214,98,168,.14), inset 0 1px 1px rgba(255,255,255,.9);\n    border-radius: 28px;\n  }\n\n  /* ── blobs ── */\n  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; z-index: 0; pointer-events: none; }\n  @keyframes bobfloat { 0%,100%{transform:translateY(0) rotate(-1.5deg);} 50%{transform:translateY(-14px) rotate(1.5deg);} }\n  @keyframes drift { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(30px,-26px) scale(1.08);} 66%{transform:translate(-20px,18px) scale(.94);} }\n  .blob.anim { animation: drift 20s ease-in-out infinite; }\n\n  /* ── nav ── */\n  .nav {\n    position: sticky; top: 0; z-index: 100;\n    padding: 14px 0;\n  }\n  .nav-inner {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 11px 14px 11px 22px; border-radius: 999px;\n    background: rgba(255,255,255,.6); backdrop-filter: blur(18px) saturate(160%);\n    -webkit-backdrop-filter: blur(18px) saturate(160%);\n    border: 1px solid rgba(255,255,255,.8); box-shadow: 0 8px 26px rgba(214,98,168,.12);\n  }\n  .brand { display: flex; align-items: center; gap: 9px; font-family: 'Fredoka'; font-weight: 600; font-size: 21px; white-space: nowrap; }\n  .brand .paw { font-size: 22px; }\n  .nav-links { display: flex; gap: 26px; align-items: center; font-weight: 700; font-size: 15px; color: var(--ink-soft); }\n  .nav-links a { white-space: nowrap; }\n  .nav-links a:hover { color: var(--bubblegum); }\n  .nav .btn { padding: 11px 22px; font-size: 15px; }\n\n  /* ── hero ── */\n  .hero { position: relative; padding: 40px 0 70px; overflow: hidden; }\n  .hero-bg { position: absolute; inset: 0; z-index: 0;\n    background: radial-gradient(120% 90% at 75% 8%, #FFE8F4 0%, #F6ECFF 48%, #FFEADF 100%); }\n  .hero-grid { position: relative; z-index: 2; display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; }\n  .eyebrow {\n    display: inline-flex; align-items: center; gap: 8px; font-family: 'Fredoka'; font-weight: 600 ign: center; }\n  .kicker { font-family:'Fredoka'; font-weight: 600; color: var(--bubblegum); letter-spacing: 1.5px; text-transform: uppercase; font-size: 14px; margin-bottom: 14px; }\n  .sec-head h2 { font-size: clamp(34px, 4.4vw, 52px); color: var(--ink); }\n  .sec-head p { font-size: 18px; font-weight: 700; color: var(--ink-soft); margin-top: 16px; line-height: 1.5; }\n\n  /* steps */\n  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }\n  .step { padding: 26px 24px; position: relative; }\n  .step .num { font-family:'Fredoka'; font-weight: 600; font-size: 15px; color: #fff; width: 32px; height: 32px; border-radius: 50%;\n    background: linear-gradient(160deg, var(--pink), var(--bubblegum)); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }\n  .step .ico { font-size: 38px; margin-bottom: 12px; }\n  .step h3 { font-size: 21px; color: var(--ink); margin-bottom: 8px; }\n  .step p { font-weight: 700; font-size: 14.5px; color: var(--ink-soft); line-height: 1.45; }\n\n  /* features */\n  .feat-sec { background: linear-gradient(180deg, #fff 0%, #FFF0F8 100%); }\n  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }\n  .feat { padding: 28px 26px; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }\n  .feat:hover { transform: translateY(-6px); }\n  .feat .ico { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 18px; }\n  .feat h3 { font-size: 22px; color: var(--ink); margin-bottom: 10px; }\n  .feat p { font-weight: 700; font-size: 15px; color: var(--ink-soft); line-height: 1.5; }\n  .feat .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }\n  .feat .tags span { font-family:'Fredoka'; font-weight: 500; font-size: 12.5px; padding: 5px 11px; border-radius: 999px; background: rgba(255,77,151,.1); color: var(--bubblegum); }\n\n  /* mini gauge */\n  .gauge-wrap { display: flex; ter; }\n  .wait-badge { display: inline-flex; align-items: center; gap: 8px; font-family:'Fredoka'; font-weight: 600; font-size: 13px;\n    letter-spacing: 1.2px; text-transform: uppercase; color: var(--lavender); background: rgba(180,155,255,.14);\n    border: 1.5px solid rgba(180,155,255,.3); padding: 7px 15px; border-radius: 999px; margin-bottom: 20px; white-space: nowrap; }\n  .wait-card h2 { font-size: clamp(32px, 4.2vw, 48px); color: var(--ink); }\n  .wait-card .sub { font-size: 18px; font-weight: 700; color: var(--ink-soft); margin: 16px auto 0; max-width: 480px; line-height: 1.5; }\n  .wait-form { display: flex; gap: 10px; max-width: 500px; margin: 30px auto 0; }\n  .wait-input { flex: 1; min-width: 0; padding: 16px 22px; border-radius: 999px; border: 1.5px solid var(--pink-soft);\n    background: #fff; font-family:'Nunito'; font-weight: 700; font-size: 16px; color: var(--ink); transition: border-color .2s, box-shadow .2s; }\n  .wait-input::placeholder { color: var(--ink-faint); }\n  .wait-input:focus { outline: none; border-color: var(--bubblegum); box-shadow: 0 0 0 4px rgba(255,77,151,.14); }\n  .wait-form .btn { flex-shrink: 0; }\n  .wait-msg { min-height: 22px; margin-top: 14px; font-weight: 700; font-size: 14.5px; }\n  .wait-msg.err { color: var(--red); }\n  .wait-note { margin-top: 8px; font-weight: 700; font-size: 13.5px; color: var(--ink-faint); }\n  .wait-proof { display: inline-flex; align-items: center; gap: 11px; margin-top: 26px; font-weight: 700; font-size: 14px; color: var(--ink-soft);\n    background: rgba(255,255,255,.6); padding: 9px 18px 9px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.8); }\n  .wait-proof .avatars span { width: 30px; height: 30px; font-size: 15px; }\n  .wait-success { display: none; flex-direction: column; align-items: center; gap: 14px; }\n  .wait-success.show { display: flex; animation: demopop .5s cubic-bezier(.34,1.56,.64,1) both; }\n  .wait-success .tick { width: 70px; height: 70px; border-radius:
