<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>Judge Paws — The First AI Relationship Court</title>

  <!-- Add-to-home-screen / PWA: open fullscreen, branded icon, never clip -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FFE8F4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Judge Paws" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />

  <!-- Analytics: GoatCounter (free, privacy-friendly). Claim judgepaws.goatcounter.com to see visits. -->
  <script data-goatcounter="https://judgepaws.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <meta name="description" content="Hold court with Judge Paws: tell your side by voice, submit the receipts, and a jury of five AI dogs delivers your verdict. Bilingual EN/中文." />
  <link rel="canonical" href="https://judgepaws.skylarnyc.com/app/index.html" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="Judge Paws — Open a Case ⚖️🐾" />
  <meta property="og:description" content="Tell your side. Let the dog decide." />
  <meta property="og:image" content="https://judgepaws.skylarnyc.com/app/assets/judge-paws-full.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

<meta name="ext-resource-dependency" content="assets/judge-paws.jpg" data-resource-id="judgePhoto" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* Safety net: paint the page canvas (incl. the home-indicator safe area) the
     same pale tone as the app's bottom, so nothing can ever read as a white edge. */
  html { background: #FBE7FF; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 120% at 50% 0%, #FFE8F4 0%, #F3E9FF 50%, #FFE6DC 100%);
    background-attachment: fixed;
    font-family: 'Nunito', sans-serif;
    padding: 24px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #root { display: flex; align-items: center; justify-content: center; }
  /* Contain-scale the fixed 402×874 design so the WHOLE phone always fits any
     screen with nothing clipped. Fixed-center pins the centre to the viewport
     so scaling is exact regardless of the design being taller than the screen.
     --jp-scale is computed in JS (capped at 1). */
  .jp-stage {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(var(--jp-scale, 1));
    transform-origin: center center; will-change: transform;
  }
  /* Phone / standalone: drop the mockup, fill the real screen edge-to-edge. The
     app's own gradient (matched here) flows continuously THROUGH the status-bar
     and home-indicator safe areas — no white bars. Safe-area padding is applied
     to the screen content (in Backdrop), not here, so the bg stays seamless. */
  .jp-stage--full {
    /* Height = the visible area MINUS the home-indicator inset, so the app's
       buttons sit inside the reachable area (never pushed off-screen). The
       home-indicator strip below is painted by html's matching #FBE7FF, so it
       reads as the same pink, never white. */
    position: fixed; top: 0; left: 0; right: 0;
    width: 100vw; height: calc(100dvh - env(safe-area-inset-bottom));
    transform: none !important;
    background: linear-gradient(165deg, #FFF1F8 0%, #FFE4F2 55%, #FBE7FF 100%);
  }
  /* black-translucent status bar text is white; the app top is pale, so lay a
     soft brand-pink fade behind the status bar for contrast (no hard white bar). */
  .jp-stage--full::before {
    content: ''; position: fixed; top: 0; left: 0; right: 0;
    height: calc(env(safe-area-inset-top) + 10px);
    background: linear-gradient(180deg, rgba(214,98,168,0.55), rgba(214,98,168,0));
    pointer-events: none; z-index: 9999;
  }
  @media (max-width: 520px) {
    body { padding: 0; }
  }

  /* ── animations ── */
  @keyframes jp-blob-float {
    0%, 100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(24px,-30px) scale(1.08); }
    66% { transform: translate(-18px,18px) scale(0.95); }
  }
  .jp-blob {
    position: absolute; border-radius: 50%;
    filter: blur(48px); opacity: 0.5;
    animation: jp-blob-float 18s ease-in-out infinite;
  }
  @keyframes jp-bob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-9px) rotate(1.5deg); }
  }
  .jp-bob { animation: jp-bob 3.4s ease-in-out infinite; }

  @keyframes jp-rise {
    0% { transform: translate(0,0) scale(0.6); opacity: 0; }
    12% { opacity: 0.9; }
    88% { opacity: 0.9; }
    100% { transform: translate(var(--drift), -780px) scale(1.05); opacity: 0; }
  }
  @keyframes jp-pop {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }
  .jp-pop { animation: jp-pop 0.42s cubic-bezier(.34,1.56,.64,1) both; }

  @keyframes jp-floatin {
    0% { transform: translateY(22px) scale(0.8); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .jp-floatin { animation: jp-floatin 0.5s cubic-bezier(.34,1.56,.64,1) both; }

  @keyframes jp-spin { to { transform: rotate(360deg); } }
  .jp-spin { animation: jp-spin 1s linear infinite; }

  @keyframes jp-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }
  .jp-pulse { animation: jp-pulse 1.3s ease-in-out infinite; }

  @keyframes jp-ring {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  @keyframes jp-stamp {
    0% { transform: rotate(-3deg) scale(2.4); opacity: 0; }
    60% { transform: rotate(-3deg) scale(0.92); opacity: 1; }
    100% { transform: rotate(-3deg) scale(1); opacity: 1; }
  }
  .jp-stamp { animation: jp-stamp 0.55s cubic-bezier(.34,1.56,.64,1) both; }

  /* screen transition (transform-only so captures/exports never catch a blank frame) */
  @keyframes jp-screen-in {
    0% { transform: translateX(26px); }
    100% { transform: translateX(0); }
  }
  .jp-screen { position: absolute; inset: 0; animation: jp-screen-in 0.4s cubic-bezier(.22,1,.36,1) both; }

  .jp-tap { transition: transform 0.16s cubic-bezier(.34,1.56,.64,1); }
  .jp-tap:active { transform: scale(0.93); }

  /* toast */
  @keyframes jp-toast { 0% { transform: translateX(-50%) translateY(30px); opacity: 0; } 100% { transform: translateX(-50%); opacity: 1; } }

  *::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="jp-theme.jsx"></script>
  <script type="text/babel" src="jp-i18n.jsx"></script>
  <script type="text/babel" src="jp-billing.jsx"></script>
  <script type="text/babel" src="jp-viz.jsx"></script>
  <script type="text/babel" src="jp-screens-1.jsx"></script>
  <script type="text/babel" src="jp-screens-tell.jsx"></script>
  <script type="text/babel" src="jp-screens-2.jsx"></script>
  <script type="text/babel" src="jp-screens-viral.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const DEVICE_H = 874;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "particles": "wild",
      "mascot": "photo",
      "motion": "lively",
      "drama": 82
    }/*EDITMODE-END*/;

    const JUDGE_PHOTO = (window.__resources && window.__resources.judgePhoto) || 'assets/judge-paws.jpg';
    const resolveMascot = (v) => v === 'photo' ? JUDGE_PHOTO : v;

    const LANG_KEY = 'judgepaws_lang';
    function getInitialLang() {
      try {
        var saved = localStorage.getItem(LANG_KEY);
        if (saved === 'en' || saved === 'zh') return saved;
      } catch (e) {}
      return (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
    }

    // EN / 中 segmented toggle, always on top
    function LangToggle({ lang, onChange }) {
      const seg = (code, label) => (
        <button onClick={() => onChange(code)} className="jp-tap" style={{
          border: 'none', cursor: 'pointer', padding: '5px 12px', borderRadius: 999,
          fontFamily: 'Fredoka, sans-serif', fontWeight: 600, fontSize: 13.5,
          background: lang === code ? 'linear-gradient(180deg,#FF87BE,#FF4D97)' : 'transparent',
          color: lang === code ? '#fff' : '#9A7690',
          boxShadow: lang === code ? '0 4px 10px rgba(255,77,151,0.4)' : 'none',
          transition: 'all 0.2s ease',
        }}>{label}</button>
      );
      return (
        <div style={{
          position: 'absolute', top: 56, right: 14, zIndex: 70, display: 'flex', gap: 2, padding: 3,
          borderRadius: 999, background: 'rgba(255,255,255,0.72)', backdropFilter: 'blur(16px)',
          WebkitBackdropFilter: 'blur(16px)', border: '1px solid rgba(255,255,255,0.85)',
          boxShadow: '0 6px 18px rgba(214,98,168,0.18)',
        }}>
          {seg('en', 'EN')}
          {seg('zh', '中')}
        </div>
      );
    }

    function ShareToast({ show, text }) {
      if (!show) return null;
      return (
        <div style={{
          position: 'absolute', bottom: 96, left: '50%', transform: 'translateX(-50%)', zIndex: 80,
          background: 'rgba(90,45,73,0.92)', color: '#fff', padding: '12px 20px', borderRadius: 999,
          fontFamily: 'Fredoka, sans-serif', fontWeight: 500, fontSize: 14, whiteSpace: 'nowrap',
          boxShadow: '0 12px 30px rgba(90,45,73,0.4)', animation: 'jp-pop 0.4s cubic-bezier(.34,1.56,.64,1) both',
        }}>{text}</div>
      );
    }

    function detectPhone() {
      try {
        return window.matchMedia('(max-width: 520px)').matches
          || window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
      } catch (e) { return false; }
    }

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [lang, setLang] = useState(getInitialLang);
      const [isPhone, setIsPhone] = useState(detectPhone);
      useEffect(() => {
        const onChange = () => setIsPhone(detectPhone());
        window.addEventListener('resize', onChange);
        window.addEventListener('orientationchange', onChange);
        return () => { window.removeEventListener('resize', onChange); window.removeEventListener('orientationchange', onChange); };
      }, []);
      const [petPhoto, setPetPhoto] = useState(() => { try { return localStorage.getItem('judgepaws_pet') || ''; } catch (e) { return ''; } });
      const setPet = useCallback((dataUrl) => {
        setPetPhoto(dataUrl || '');
        try { if (dataUrl) localStorage.setItem('judgepaws_pet', dataUrl); else localStorage.removeItem('judgepaws_pet'); } catch (e) {}
      }, []);
      const [screen, setScreen] = useState('home');
      const [state, setState] = useState(() => ({ relType: null, story: '', you: '', them: '', evidence: [], mode: 'default', caseData: buildCase('couple', getInitialLang()) }));
      const [toast, setToast] = useState(false);

      const particlesOff = t.particles === 'off';
      const chaos = t.particles === 'wild';
      const calm = t.motion === 'calm';

      const changeLang = useCallback((next) => {
        setLang(next);
        try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
        // re-translate the active case content
        setState(s => ({ ...s, caseData: buildCase(s.relType || 'couple', next, { you: s.you, them: s.them }) }));
      }, []);

      const go = useCallback((next) => {
        setState(s => {
          // showcase (viral) cases carry their own verdict — don't rebuild it on the way to build
          if (next === 'build') return s.showcase ? s : { ...s, showcase: false, caseData: buildCase(s.relType || 'couple', lang, { you: s.you, them: s.them }) };
          if (next === 'type') return { ...s, showcase: false };
          if (next === 'home') return { relType: null, story: '', you: '', them: '', evidence: [], mode: 'default', showcase: false, caseData: buildCase('couple', lang) };
          return s;
        });
        setScreen(next);
      }, [lang]);

      const onShare = useCallback(() => {
        setToast(true);
        setTimeout(() => setToast(false), 2600);
      }, []);

      const shared = { go, state: { ...state, onShare }, setState, chaos,
        off: particlesOff, mascot: petPhoto || resolveMascot(t.mascot), drama: t.drama, lang,
        petPhoto, onPetPhoto: setPet };
      const screens = {
        home:    <HomeScreen {...shared} />,
        type:    <TypeScreen {...shared} />,
        tell:    <TellScreen {...shared} />,
        viral:   <ViralScreen {...shared} />,
        upload:  <UploadScreen {...shared} />,
        build:   <BuildScreen {...shared} />,
        court:   <CourtScreen {...shared} />,
        verdict: <VerdictScreen {...shared} />,
      };

      return (
        <React.Fragment>
          {calm && <style>{`.jp-blob{animation-duration:46s!important;opacity:0.35!important;} .jp-bob{animation-duration:6s!important;} .jp-screen{animation:none!important;}`}</style>}
          <div className={isPhone ? 'jp-stage jp-stage--full' : 'jp-stage'}>
          <IOSDevice height={isPhone ? '100%' : DEVICE_H} bare={isPhone}>
            <div style={{ position: 'relative', width: '100%', height: isPhone ? '100%' : DEVICE_H }}>
              <div key={screen} className="jp-screen" style={{ height: '100%' }}>{screens[screen]}</div>
              <LangToggle lang={lang} onChange={changeLang} />
              <ShareToast show={toast} text={I18N[lang].toast} />
            </div>
          </IOSDevice>
          </div>
          <TweaksPanel title="Tweaks">
            <TweakSection label="Vibe" />
            <TweakRadio label="Particles" value={t.particles}
              options={['off', 'tasteful', 'wild']}
              onChange={(v) => setTweak('particles', v)} />
            <TweakRadio label="Motion" value={t.motion}
              options={['lively', 'calm']}
              onChange={(v) => setTweak('motion', v)} />
            <TweakSection label="Cast" />
            <TweakSelect label="Judge" value={t.mascot}
              options={[
                { value: 'photo', label: '\uD83D\uDC36 Judge Paws (photo)' },
                { value: '\uD83D\uDC36', label: '\uD83D\uDC36 Corgi emoji' },
                { value: '\uD83D\uDC15', label: '\uD83D\uDC15 Good boy' },
                { value: '\uD83D\uDC31', label: '\uD83D\uDC31 Judge Cat' },
                { value: '\uD83E\uDD8A', label: '\uD83E\uDD8A Sly fox' },
                { value: '\uD83D\uDC3B', label: '\uD83D\uDC3B Big bear' },
              ]}
              onChange={(v) => setTweak('mascot', v)} />
            <TweakSection label="Verdict" />
            <TweakSlider label="Drama level" value={t.drama} min={0} max={100} unit=""
              onChange={(v) => setTweak('drama', v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Fit the whole 402×{DEVICE_H} phone into any viewport — contain-scale, never clip.
    function fitStage() {
      var vw = window.innerWidth, vh = window.innerHeight;
      var pad = vw <= 520 ? 0 : 48; // edge-to-edge on phones, breathing room on desktop
      var s = Math.min((vw - pad) / 402, (vh - pad) / DEVICE_H, 1);
      document.documentElement.style.setProperty('--jp-scale', s);
    }
    window.addEventListener('resize', fitStage);
    window.addEventListener('orientationchange', function () { setTimeout(fitStage, 80); });
    window.addEventListener('load', fitStage);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitStage);
    fitStage();
    requestAnimationFrame(fitStage);
  </script>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#FFE4F2"/>
      <text x="50" y="62" font-size="48" text-anchor="middle">🐶</text>
    </svg>
  </template>
</body>
</html>
